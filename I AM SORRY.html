<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#09070B">
<title>I AM SORRY</title>
<style>
:root{--bg:#09070B;--ink:#FFF5FB;--rose:#FF9BC8;--deep:#F04E91;--muted:#c9a3b6;box-sizing:border-box}
*,*::before,*::after{box-sizing:inherit}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);overflow-x:hidden;-webkit-text-size-adjust:100%}
body{font-family:Inter,Manrope,-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI","Noto Sans","Helvetica Neue",Arial,sans-serif}
main{position:relative;min-height:100vh;min-height:100svh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:clamp(18px,4svh,36px);padding:max(24px,env(safe-area-inset-top)) 18px max(40px,calc(env(safe-area-inset-bottom) + 28px));text-align:center;overflow:hidden;
background:radial-gradient(ellipse 80% 55% at 50% 50%,rgba(240,78,145,.17),transparent 70%),radial-gradient(ellipse 120% 90% at 50% 50%,#1a0b17 0%,#0f080e 45%,#09070B 80%)}
.intro{margin:0;font-size:clamp(12px,3.3vw,15px);letter-spacing:.14em;color:var(--muted);font-weight:400}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.stage{width:100%;max-width:min(980px,100%);display:flex;justify-content:center}
svg{display:block;width:100%;height:auto;max-height:62svh;overflow:visible;filter:drop-shadow(0 0 14px rgba(240,78,145,.28))}
svg text{font-family:Inter,Manrope,-apple-system,"SF Pro Display","Segoe UI","Noto Sans","Hiragino Sans","PingFang SC","Malgun Gothic","Noto Sans Devanagari","Noto Sans Arabic","Noto Sans Thai","Helvetica Neue",Arial,sans-serif}
.big{font-weight:900;letter-spacing:-.02em}
.close{margin:0;font-size:clamp(14px,3.8vw,18px);color:#e8cdda;letter-spacing:.02em;line-height:1.5}
.btn{appearance:none;-webkit-appearance:none;background:transparent;border:1px solid rgba(255,155,200,.35);color:var(--rose);font:inherit;font-size:14px;letter-spacing:.06em;min-height:46px;padding:0 22px;border-radius:999px;cursor:pointer;transition:background .25s,border-color .25s,transform .15s;-webkit-tap-highlight-color:transparent;touch-action:manipulation}
.btn:hover{background:rgba(240,78,145,.12);border-color:rgba(255,155,200,.65)}
.btn:active{background:rgba(240,78,145,.28);transform:scale(.96)}
.btn:focus-visible{outline:2px solid var(--rose);outline-offset:3px}
@keyframes rise{from{opacity:0;transform:translateY(22px)}to{opacity:1;transform:translateY(0)}}
@keyframes fade{from{opacity:0}to{opacity:1}}
.play .intro{animation:fade 1s ease .3s both}
.play .L{animation:rise 1s cubic-bezier(.22,.8,.24,1) var(--d) both}
.play .row{animation:fade 1.1s ease var(--d) both}
.play .close{animation:fade 1.2s ease 5.4s both}
.play .ctl{animation:fade 1s ease 6.2s both}
@media (prefers-reduced-motion:reduce){.play *{animation:none!important}}
</style>
</head>
<body>
<main id="app">
  <p class="intro">a little message, in many languages</p>
  <h1 class="sr">I am sorry</h1>
  <div class="stage" id="stage" aria-hidden="true"></div>
  <p class="close">No perfect words. Just a sincere apology.</p>
  <div class="ctl"><button class="btn" id="replay" type="button" aria-label="Replay animation">Replay animation ↻</button></div>
  <noscript><p class="close">I AM SORRY</p></noscript>
</main>
<script>
(function(){
"use strict";
var NS="http://www.w3.org/2000/svg";
var WORDS=["Sorry","I am sorry","Forgive me","Please forgive me","माफ़ कीजिए","मुझे माफ़ करना","क्षमा करें","माफ करा","मला माफ कर","Lo siento","Perdón","Perdóname","Désolé","Je suis désolé","Pardon","Es tut mir leid","Entschuldigung","Mi dispiace","Scusa","Perdonami","Desculpa","Sinto muito","ごめんなさい","ごめんね","申し訳ありません","对不起","抱歉","죄송합니다","미안해요","Прости","Извини","أنا آسف","Özür dilerim","Maaf","Maafkan aku","Xin lỗi","ขอโทษ","Het spijt me","Förlåt","Undskyld","Anteeksi","Przepraszam","Promiň","Žao mi je","Συγγνώμη","Sajnálom","Îmi pare rău","Pasensya na","Samahani","Oprosti"];
var COLORS=["#FFF5FB","#FF9BC8","#F4B6D2","#F04E91","#FFE3F0"];
var FS=112,WFS=7,CAP=82,STEP=8.4;
var W={I:46,A:84,M:100,S:76,O:84,R:80,Y:78};
var STARTS=[.9,1.3,1.7,2.7,3.08,3.46,3.84,4.22];
var app=document.getElementById("app"),stage=document.getElementById("stage"),btn=document.getElementById("replay");
var mq=window.matchMedia("(min-width:700px)");
var seed=7;
function rnd(){seed=(seed*16807)%2147483647;return seed/2147483647}
function el(n,a,p){var e=document.createElementNS(NS,n);for(var k in a)e.setAttribute(k,a[k]);if(p)p.appendChild(e);return e}
function wlen(s){var n=0;for(var i=0;i<s.length;i++)n+=s.charCodeAt(i)>0x2E80?WFS:WFS*.58;return n}
function build(){
  seed=7;stage.textContent="";
  var wide=mq.matches;
  var lines=wide?[["I","A","M","|","S","O","R","R","Y"]]:[["I","A","M"],["S","O","R","R","Y"]];
  var vbW=wide?660:400,lineH=wide?118:112;
  var vbH=lines.length*lineH+(wide?0:6);
  var svg=el("svg",{viewBox:"0 0 "+vbW+" "+vbH,focusable:"false","aria-hidden":"true"},stage);
  var defs=el("defs",{},svg);
  var g=el("linearGradient",{id:"gr",x1:0,y1:0,x2:0,y2:1},defs);
  el("stop",{offset:"0","stop-color":"#FFF5FB"},g);el("stop",{offset:".5","stop-color":"#FF9BC8"},g);el("stop",{offset:"1","stop-color":"#F04E91"},g);
  var idx=0;
  lines.forEach(function(line,li){
    var total=0;line.forEach(function(c){total+=c==="|"?30:W[c]});
    var x=(vbW-total)/2,base=li*lineH+98;
    line.forEach(function(c){
      if(c==="|"){x+=30;return}
      var w=W[c],cx=x+w/2,id="c"+idx;
      var cp=el("clipPath",{id:id},defs);
      var t=el("text",{x:cx,y:base,"text-anchor":"middle","font-size":FS,"font-weight":900,"class":"big"},cp);t.textContent=c;
      var d=STARTS[idx];
      var L=el("g",{"class":"L",style:"--d:"+d+"s"},svg);
      var b=el("text",{x:cx,y:base,"text-anchor":"middle","font-size":FS,"class":"big",fill:"url(#gr)","fill-opacity":".32"},L);b.textContent=c;
      var rows=el("g",{"clip-path":"url(#"+id+")"},L);
      var r=0;
      for(var y=base-CAP+6;y<=base+2;y+=STEP,r++){
        var row=el("text",{"class":"row",x:x-6-rnd()*14,y:y,"font-size":WFS,style:"--d:"+(d+.45+r*.06).toFixed(2)+"s"},rows);
        var len=0,k=Math.floor(rnd()*WORDS.length),guard=0;
        while(len<w+30&&guard++<30){
          var wd=WORDS[k%WORDS.length];k+=1+Math.floor(rnd()*5);
          var ts=el("tspan",{fill:COLORS[Math.floor(rnd()*COLORS.length)],"font-weight":rnd()>.8?700:500},row);
          ts.textContent=wd+"   ";len+=wlen(wd)+WFS*1.6;
        }
      }
      x+=w;idx++;
    });
  });
}
function replay(){
  app.classList.remove("play");
  void app.offsetWidth;
  app.classList.add("play");
}
try{build();replay()}catch(e){try{console.error(e)}catch(_){}}
btn.addEventListener("click",replay);
var onChange=function(){try{build();replay()}catch(e){}};
if(mq.addEventListener)mq.addEventListener("change",onChange);else if(mq.addListener)mq.addListener(onChange);
})();
</script>
</body>
</html>
